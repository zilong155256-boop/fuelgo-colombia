<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FuelGo – Pantallas</title>
<style>:root{--g:#064632;--accent:#087549;--gold:#ffdc65;--ink:#193a30;--muted:#526b60;--line:#dce8df;--soft:#edf5ef}*{box-sizing:border-box;margin:0}html,body{width:100%;overflow-x:hidden}body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:transparent}img{display:block;object-fit:contain;max-width:100%}.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.row{display:flex;gap:14px;padding:0 14px 12px;width:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding-inline:14px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;cursor:grab}.row::-webkit-scrollbar{display:none}.row.is-dragging{cursor:grabbing;scroll-snap-type:none}.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}.preview-slide{position:relative;flex:none;scroll-snap-align:start;scroll-snap-stop:always}.preview-slide>.ph{position:absolute;top:0;left:0;pointer-events:none}.ph{width:414px;height:868px;padding:12px;border-radius:48px;background:#cbd3ce;box-shadow:0 4px 10px #163b2520}.sc{width:390px;height:844px;border-radius:37px;overflow:hidden;position:relative;background:#f8faf8;box-shadow:0 0 0 4px #182b25;display:flex;flex-direction:column}.sb{position:absolute;top:13px;left:30px;right:26px;display:flex;align-items:center;justify-content:space-between;color:white;font-size:14px;font-weight:650;z-index:2}.hi{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:130px;height:5px;background:#193a30;border-radius:5px;z-index:4}.hd{flex:none;background:var(--g);padding:39px 16px 9px;color:#fff;border-radius:0 0 16px 16px}.hd h1{font-size:15px;line-height:20px;margin-top:5px}.mx-app-head,.mx-app-brand,.mx-between{display:flex;align-items:center;justify-content:space-between;gap:7px}.mx-app-head>.i{color:#fff}.mx-app-brand img{width:32px;height:32px;border-radius:7px}.mx-app-brand b{font-size:21px;letter-spacing:-.5px}.bd{min-height:0;flex:1;display:flex;flex-direction:column;padding:8px 13px;gap:8px;overflow:hidden}.bd>*{flex-shrink:0;min-width:0}.nv{flex:none;height:76px;background:white;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px 6px 16px;border-top:1px solid var(--line)}.nv a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:10px;color:var(--muted);font-size:10px;font-weight:650;text-align:center;text-decoration:none}.nv a.on{background:#fff0bc;color:var(--g)}.nv .i{width:21px;height:21px}.cd,.br>div,.history-entry{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.h2{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:750;line-height:19px}.h2 .i{width:19px;height:19px;color:var(--accent)}.aux{font-size:11px;line-height:1.35;color:var(--muted)}.bt,.bt.s{display:flex;align-items:center;justify-content:center;gap:5px;min-height:32px;border-radius:10px;background:var(--gold);color:var(--g);font-size:12px;font-weight:800;text-align:center;padding:5px}.bt .i{width:16px;height:16px}.mx-app-banner{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:10px 12px;border-radius:13px;background:linear-gradient(115deg,#064632,#0c7650);color:white;min-height:105px}.mx-app-banner>div{display:flex;flex-direction:column;gap:2px;min-width:0}.mx-app-banner small{color:var(--gold);font-size:10px;font-weight:750}.mx-app-banner strong{font-size:15px;line-height:1.2}.mx-app-banner b{color:var(--gold);font-size:30px;line-height:1.1;letter-spacing:-.5px}.mx-app-banner span{font-size:10px}.mx-banner-art{width:98px;height:88px;flex:none}.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tl>div{height:49px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;padding:3px;background:var(--soft);border:1px solid var(--line);border-radius:11px;font-size:11px;font-weight:700;color:var(--g);line-height:1.15}.tl .i{width:20px;height:20px;color:var(--accent)}.br{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.br>div{height:42px;padding:3px;display:grid;place-items:center}.br img{width:100%;height:34px}.mx-demo{background:#fff0bd;color:#735618;border-radius:5px;padding:3px 5px;font-size:9px;font-weight:800;white-space:nowrap}.mx-between{font-size:13px}.pr{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 10px}.mx-price-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:5px 0;font-size:11px}.mx-price-grid b{display:block;color:var(--g)}.mx-near{padding:7px 10px}.mx-near .bt{min-height:29px;margin-top:5px}.mx-banks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.mx-banks img{width:100%;height:37px;border:1px solid var(--line);border-radius:7px;padding:1px;background:white}.mx-footnote{font-size:10px}.mx-home{gap:6px}.ch{display:flex;gap:4px}.ch span{display:flex;align-items:center;justify-content:center;min-width:0;flex:1;height:31px;border:1px solid var(--line);border-radius:18px;background:white;font-size:11px;font-weight:650}.ch span.on{background:var(--g);color:white}.ch img{width:100%;height:25px;padding:2px}.cp{display:grid;grid-template-columns:56px minmax(0,1fr) 76px;align-items:center;gap:6px;border-left:4px solid var(--accent);padding:9px 8px}.cp>img{width:56px;height:52px;padding:2px}.cp .t{font-size:13px;font-weight:700;line-height:1.2}.cp .d{font-size:25px;font-weight:900;color:var(--g);line-height:1.15}.cp .d small{font-size:11px}.cp .ml{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:5px;border-top:1px solid var(--line);padding-top:6px;color:var(--muted);font-size:10px;line-height:1.25}.ml span{display:flex;align-items:flex-start;gap:3px}.ml .i{width:13px;height:13px}.mx-notice{display:flex;align-items:center;gap:8px;background:var(--soft);padding:9px 10px}.mx-notice>.i{color:var(--accent)}.mx-notice strong{font-size:13px}.mx-qr-card{display:flex;flex-direction:column;gap:8px;padding:12px;text-align:center}.mx-qr-value{font-size:32px;font-weight:900;color:var(--g);line-height:1.1}.mx-qr-value small{font-size:14px}.mx-qr-placeholder{margin:auto;width:156px;height:156px;border:2px solid var(--accent);border-radius:15px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.mx-qr-placeholder .i{width:88px;height:88px;color:var(--g)}.mx-qr-placeholder span{font-size:10px;font-weight:800}.mx-code{display:flex;align-items:center;justify-content:space-between;padding:8px;background:#fff0bc;border-radius:9px;font-size:12px;font-weight:700}.mx-qr-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.mx-qr-steps>div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:8px 4px;border:1px solid var(--line);background:white;border-radius:10px}.mx-qr-steps .i{color:var(--accent)}.mx-qr-steps small{font-size:10px;color:var(--muted)}.mx-qr-steps strong{font-size:11px}.history-summary{display:flex;align-items:center;justify-content:space-around;background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:13px}.history-stat{display:flex;align-items:center;gap:8px;color:var(--g)}.history-stat>div{display:flex;flex-direction:column}.history-stat span{font-size:11px}.history-stat strong{font-size:25px}.history-sep{height:34px;width:1px;background:var(--line)}.history-heading{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:750;gap:6px}.history-list{display:grid;gap:7px}.history-entry{display:grid;grid-template-columns:4px 42px minmax(0,1fr) auto;gap:7px;align-items:center;min-height:72px;padding:8px 8px 8px 0}.history-rail{align-self:stretch;background:var(--accent);border-radius:0 4px 4px 0}.history-rail.u{background:#a7b3ac}.history-rail.v{background:#d9b455}.history-logo img{width:42px;height:42px;padding:2px}.history-info{display:flex;flex-direction:column;gap:2px;min-width:0}.history-info strong{font-size:13px;line-height:1.25}.history-info>span,.history-info small{font-size:11px;color:var(--muted)}.history-info small{display:flex;align-items:center;gap:3px}.history-info small .i{width:13px;height:13px}.history-status{font-size:10px;font-weight:650;padding:4px 6px;border-radius:12px;background:#e3f2e6;color:var(--accent)}.history-status.u{background:#edf0ee;color:var(--muted)}.history-status.v{background:#fff0bc;color:#735618}.mx-account-top{display:grid;grid-template-columns:48px minmax(0,1fr) 20px;align-items:center;gap:10px;background:var(--soft)}.mx-account-top strong{font-size:17px}.mx-avatar{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--g);color:white}.mx-avatar .i{width:26px;height:26px}.mn{display:grid;grid-template-columns:24px minmax(0,1fr) 20px;align-items:center;gap:9px;height:48px;font-size:13px;font-weight:650}.mn>.i{color:var(--accent)}.mx-account-foot{text-align:center;font-size:11px;color:var(--muted);padding:8px}.mx-dots{display:flex;justify-content:center;gap:4px;height:26px;padding:0 0 4px}.mx-dots button{appearance:none;border:0;border-radius:50%;width:22px;height:22px;padding:6px;background:transparent;cursor:pointer}.mx-dots button:after{content:"";display:block;width:10px;height:10px;border-radius:50%;background:#bfcfc4}.mx-dots button.on:after{background:var(--accent)}.mx-dots button:focus-visible{outline:2px solid var(--accent)}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}.br img,.ch img,.cp>img,.history-logo img,.mx-banks img{object-fit:contain!important;object-position:center!important;transform:none!important;clip-path:none!important;min-width:0;min-height:0;max-width:100%;padding:3px;box-sizing:border-box}.br img{height:36px}.cp>img{height:56px}.ch img{height:27px}.mx-banks img{height:40px}</style></head><body><div class="row" id="app" tabindex="0" role="region" aria-label="Pantallas de FuelGo, desliza a izquierda o derecha"></div>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></symbol>
<symbol id="i-tkt" viewBox="0 0 24 24"><path d="M3 8a2 2 0 012-2h14a2 2 0 012 2v2a2 2 0 000 4v2a2 2 0 01-2 2H5a2 2 0 01-2-2v-2a2 2 0 000-4zM10 9l4 6"/></symbol>

<symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol><symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>

<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5"/></symbol>

<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></symbol>

<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></symbol>

<symbol id="i-pump" viewBox="0 0 24 24"><path d="M5 21V4h9v17M3 21h13M5 9h9M14 8l3 2v8a1.5 1.5 0 003 0v-7l-2-2"/></symbol>
<symbol id="i-qr" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h3v3h-3zM20 14v6h-3"/></symbol>
</defs></svg>
<script>
const A={mobil:'./mobil.webp',g500:'./g500.webp',oxxogas:'./oxxo-gas.webp',shell:'./assets/app-html/shell.png',repsol:'./repsol.webp',logo:'./fuelgo-logo.svg',bbva:'./bbva.webp',banorte:'./banorte.webp',banamex:'./banamex.webp',santander:'./santander.webp',mercado:'./mercado-pago.webp',spin:'./spin.webp',azteca:'./banco-azteca.webp',nu:'./nu.webp'};
const I=n=>`<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`,L=(n,c='')=>`<img class="${c}" src="${A[n]}" alt="${n}" decoding="async">`;
const sb=`<div class="sb"><span>10:24</span><svg width="66" height="14" viewBox="0 0 66 14" fill="#fff"><rect y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" width="3" height="14" rx="1"/><path d="M27 4a9 9 0 0112 0M29.5 7a5.5 5.5 0 017 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="33" cy="11" r="1.6"/><rect x="45" y="1" width="19" height="11" rx="3" fill="none" stroke="#fff"/><rect x="47" y="3" width="15" height="7" rx="1.5"/></svg></div>`;
const nav=a=>`<nav class="nv">`+[['Inicio','home'],['Cupones','tkt'],['Escanear QR','qr'],['Historial','clip'],['Mi cuenta','user']].map(([t,i],k)=>`<a class="${k===a?'on':''}">${I(i)}${t}</a>`).join('')+`</nav>`;
const hd=(title,icon='menu')=>`<header class="hd"><div class="mx-app-head">${I(icon)}<div class="mx-app-brand">${L('logo')}<b>FuelGo</b></div>${I('bell')}</div><h1>${title}</h1></header>`;
const ph=c=>`<div class="ph"><div class="sc">${sb}${c}<i class="hi"></i></div></div>`;
const brands=['mobil','g500','oxxogas','shell','repsol'],nm={mobil:'Mobil',g500:'G500',oxxogas:'OXXO GAS',shell:'Shell',repsol:'Repsol'};
const banks=['bbva','banorte','banamex','santander','mercado','spin','azteca','nu'];
const demo=`<span class="mx-demo">VISTA PREVIA</span>`;
const art=`<svg class="mx-banner-art" viewBox="0 0 120 110" aria-hidden="true"><circle cx="63" cy="56" r="48" fill="#ffdc65" opacity=".10"/><circle cx="63" cy="56" r="40" stroke="#ffdc65" stroke-opacity=".35" fill="none"/><g transform="rotate(-12 70 40)"><rect x="45" y="18" width="65" height="39" rx="6" fill="#b88725"/><path d="M45 15h65v12a6 6 0 0 0 0 12v14H45V39a6 6 0 0 0 0-12Z" fill="#ffdc65"/><path d="M60 17v34" stroke="#aa7925" stroke-dasharray="3 3"/><text x="84" y="42" font-size="23" font-weight="900" fill="#785016" text-anchor="middle">%</text></g><g fill="#fff1b6" stroke="#f1b93d" stroke-width="2"><rect x="18" y="45" width="37" height="52" rx="5"/><rect x="24" y="51" width="25" height="19" rx="2" fill="#14583d"/><path d="M55 65h5q6 0 6 7v13q0 8 7 8t7-8V62l-8-8" fill="none" stroke="#ffdc65" stroke-width="4" stroke-linecap="round"/><path d="M13 97h48" stroke-width="4"/></g><g fill="#ffda60" stroke="#bd8b2d" stroke-width="2"><circle cx="100" cy="85" r="13"/><circle cx="100" cy="85" r="9" fill="none"/><circle cx="83" cy="99" r="8"/></g><path d="M16 14l3 7 7 3-7 3-3 7-3-7-7-3 7-3Z" fill="#fff1b6"/></svg>`;
const banner=(title)=>`<div class="mx-app-banner"><div><small>FUELGO MÉXICO</small><strong>${title}</strong><b>30%–50%</b><span>En promociones seleccionadas</span></div>${art}</div>`;
const home=hd('Inicio')+`<div class="bd mx-home">${banner('Ahorra en combustible')}<div class="tl">${[['tkt','Cupones'],['bolt','Recarga'],['car','Servicios para tu auto']].map(([i,t])=>`<div>${I(i)}${t}</div>`).join('')}</div><div class="h2">${I('pump')}Marcas de estaciones</div><div class="br">${brands.map(b=>`<div>${L(b)}</div>`).join('')}</div><div class="pr"><div class="mx-between"><strong>Precios por litro · CDMX</strong>${demo}</div><div class="mx-price-grid"><div>Gasolina regular<b>MXN/L</b></div><div>Diésel<b>MXN/L</b></div></div><p class="aux">Consulta precios vigentes en la app. Sin datos en tiempo real.</p></div><div class="h2">${I('pin')}Estaciones cercanas</div><div class="cd mx-near"><p class="aux">Activa tu ubicación para consultar estaciones disponibles.</p><div class="bt">Consultar estaciones ${I('chev')}</div></div><div class="h2">${I('info')}Bancos y billeteras</div><div class="mx-banks">${banks.map(b=>L(b)).join('')}</div><p class="aux mx-footnote">Disponibilidad y medios de pago según promoción.</p></div>`+nav(0);
const cup=[['mobil','30%'],['shell','50%'],['g500','40%']];
const cupones=hd('Cupones','back')+`<div class="bd mx-coupons"><div class="ch"><span class="on">Todos</span>${brands.map(b=>`<span>${L(b)}</span>`).join('')}</div>${banner('Cupones de combustible')}<div class="mx-between"><strong>Ejemplos de cupones</strong>${demo}</div>${cup.map(([b,d])=>`<div class="cd cp">${L(b)}<div><div class="t">Cupón de combustible</div><div class="d">${d} <small>DTO.</small></div><div class="aux">Combustible seleccionado</div></div><div class="bt s">Ver detalle</div><div class="ml"><span>${I('cal')}Vigencia: consulta en la app</span><span>${I('pin')}Estaciones según promoción</span></div></div>`).join('')}<div class="cd mx-notice">${I('info')}<div><strong>Reglas de uso</strong><p class="aux">Ejemplos ilustrativos. Los descuentos, marcas aplicables y vigencia se confirman en la app.</p></div></div></div>`+nav(1);
const qr=hd('Escanear QR','back')+`<div class="bd mx-qr"><div class="cd mx-qr-card"><div class="mx-between"><strong>Cupón de combustible</strong>${demo}</div><div class="mx-qr-value">30% <small>DTO.</small></div><div class="mx-qr-placeholder" aria-label="Ejemplo de código QR no válido">${I('qr')}<span>QR DE EJEMPLO</span></div><div class="mx-code">Código de demostración ${I('copy')}</div><p class="aux">No válido para canje. Tu código se genera al obtener un cupón.</p></div><div class="h2">¿Cómo usarlo?</div><div class="mx-qr-steps">${[['qr','Muestra el QR'],['pump','Aplica el descuento'],['ok','Paga y listo']].map(([i,t],k)=>`<div>${I(i)}<small>Paso ${k+1}</small><strong>${t}</strong></div>`).join('')}</div><div class="cd mx-notice">${I('cal')}<div><strong>Vigencia y condiciones</strong><p class="aux">Consulta los detalles de tu cupón en la app.</p></div></div><div class="bt">Ver mis cupones</div></div>`+nav(2);
const rec=[['mobil','30%','Disponible','a'],['shell','50%','Usado','u'],['g500','40%','Vencido','v']];
const hist=hd('Historial','back')+`<div class="bd history-page"><div class="history-summary"><div class="history-stat">${I('tkt')}<div><span>Mis cupones</span><strong>—</strong></div></div><div class="history-sep"></div><div class="history-stat">${I('ok')}<div><span>Utilizados</span><strong>—</strong></div></div></div><div class="history-heading"><span>Ejemplos de movimientos</span>${demo}</div><div class="history-list">${rec.map(([b,d,status,state])=>`<div class="history-entry"><span class="history-rail ${state}"></span><span class="history-logo">${L(b)}</span><div class="history-info"><strong>Cupón de combustible</strong><span>${nm[b]} · ${d} DTO.</span><small>${I('cal')}Fecha según actividad</small></div><span class="history-status ${state}">${status}</span></div>`).join('')}</div><div class="cd mx-notice">${I('info')}<div><strong>Tu actividad en FuelGo</strong><p class="aux">Inicia sesión para consultar tus cupones y movimientos reales.</p></div></div><div class="bt">Ver mi historial</div></div>`+nav(3);
const acc=hd('Mi cuenta','back')+`<div class="bd mx-account"><div class="cd mx-account-top"><div class="mx-avatar">${I('user')}</div><div><strong>Inicia sesión</strong><p class="aux">Accede a tus cupones y beneficios.</p></div>${I('chev')}</div><div class="h2">Tu cuenta</div>${[['tkt','Mis cupones'],['doc','Mis pedidos'],['heart','Mis estaciones favoritas'],['bell','Notificaciones'],['help','Ayuda y soporte'],['shield','Términos y privacidad'],['info','Acerca de FuelGo']].map(([i,t])=>`<div class="cd mn">${I(i)}<span>${t}</span>${I('chev')}</div>`).join('')}<div class="mx-account-foot">FuelGo México · Vista previa</div></div>`+nav(4);
/* HTML/CSS screens inside one swipeable gallery. */
const screens=[ph(home),ph(cupones),ph(qr),ph(hist),ph(acc)];
app.innerHTML=screens.map((screen,i)=>'<div class="preview-slide" aria-label="Pantalla '+(i+1)+' de 5">'+screen.replace(/<img /g,'<img loading="lazy" decoding="async" ')+'</div>').join('');
const firstPhone=app.querySelector('.preview-slide img');
if(firstPhone)firstPhone.loading='eager';
function fitPreview(){
 const vw=document.documentElement.clientWidth||window.innerWidth;
 const count=vw>=1250?3:vw>=780?2:1;
 const width=Math.min(414,Math.max(1,(vw-28-(count-1)*14)/count)); app.style.maxWidth=(width*count+28+(count-1)*14)+'px'; app.style.marginInline='auto';
 const scale=width/414;
 for(const slide of app.children){slide.style.width=width+'px';slide.style.height=868*scale+'px';slide.firstElementChild.style.transform='scale('+scale+')';slide.firstElementChild.style.transformOrigin='top left';}
 app.style.height=(868*scale+12)+'px';
 updateDots();
}
const dots=document.createElement('div');dots.className='mx-dots';dots.setAttribute('aria-label','Seleccionar pantalla');const names=['Inicio','Cupones','Escanear QR','Historial','Mi cuenta'];dots.innerHTML=names.map((n,i)=>'<button type="button" aria-label="'+n+'" data-slide="'+i+'"></button>').join('');app.after(dots);
function updateDots(){const slides=Array.from(app.children);const stride=slides[1]?slides[1].offsetLeft-slides[0].offsetLeft:1;const index=Math.round(app.scrollLeft/Math.max(stride,1));dots.querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('on',i===index);b.setAttribute('aria-current',i===index?'true':'false');});}
dots.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const slide=app.children[Number(b.dataset.slide)];if(slide)app.scrollTo({left:slide.offsetLeft-app.children[0].offsetLeft,behavior:'smooth'});});
app.addEventListener('scroll',updateDots,{passive:true});
fitPreview();
window.addEventListener('resize',fitPreview);
(function setupPreviewDrag(){
 const scroller=app;
 let startX=0,startLeft=0,dragging=false,dragDistance=0;
 scroller.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse'||e.button!==0)return;
  dragging=true;startX=e.clientX;startLeft=scroller.scrollLeft;dragDistance=0;
  scroller.classList.add('is-dragging');
  scroller.setPointerCapture(e.pointerId);
 });
 scroller.addEventListener('pointermove',e=>{
  if(!dragging)return;
  dragDistance=e.clientX-startX;scroller.scrollLeft=startLeft-dragDistance;
 });
 function finish(){
  if(!dragging)return;
  dragging=false;
  scroller.classList.remove('is-dragging');
  const slides=Array.from(scroller.children);
  const stride=slides[1]?slides[1].offsetLeft-slides[0].offsetLeft:scroller.clientWidth;
  const target=Math.max(0,Math.min(slides.length-1,Math.round(scroller.scrollLeft/Math.max(stride,1))));
  scroller.scrollTo({left:target*stride,behavior:'smooth'});
 }
 scroller.addEventListener('pointerup',finish);
 scroller.addEventListener('pointercancel',finish);
 scroller.addEventListener('lostpointercapture',finish);
 scroller.addEventListener('keydown',e=>{
  if(!['ArrowLeft','ArrowRight'].includes(e.key))return;
  e.preventDefault();
  const slides=Array.from(scroller.children),step=slides[1]?slides[1].offsetLeft-slides[0].offsetLeft:scroller.clientWidth;
  const i=Math.round(scroller.scrollLeft/step)+(e.key==='ArrowRight'?1:-1);
  scroller.scrollTo({left:Math.max(0,Math.min(slides.length-1,i))*step,behavior:'smooth'});
 });
 scroller.addEventListener('click',e=>{if(Math.abs(dragDistance)>6){e.preventDefault();e.stopPropagation();dragDistance=0}},true);
})();

</script></body></html>
