 if(!navigator.mediaDevices?.getUserMedia){status.textContent='La cámara no está disponible en este navegador.';return;}
 try{
  fgCameraStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});
  const live=document.getElementById('fg-scan-video');
  if(!live){stopFuelGoScanner();return;}
  live.srcObject=fgCameraStream;await live.play();
  status.textContent='Apunta la cámara al código QR del cliente.';
  if(!('BarcodeDetector' in window)){status.textContent='La cámara está activa, pero este navegador no admite la lectura automática de códigos QR.';return;}
  const detector=new BarcodeDetector({formats:['qr_code']});
  let busy=false;
  const tick=async()=>{
   if(!fgCameraStream||!document.getElementById('fg-scan-video'))return;
   if(!busy&&live.readyState>=2){
    busy=true;
    try{const codes=await detector.detect(live);if(codes.length){
     status.textContent='Código detectado. La validación del cupón debe realizarse con el sistema de canje.';
     stopFuelGoScanner();return;
    }}catch(err){}finally{busy=false;}
   }
   fgScanFrame=requestAnimationFrame(tick);
  };
  fgScanFrame=requestAnimationFrame(tick);
 }catch(error){stopFuelGoScanner();status.textContent='No fue posible activar la cámara. Revisa los permisos.';}
}

function setupHero(){
 const el=app.querySelector('.hero-slider');if(!el)return;let startX=0,startY=0,pressed=false,tracking=false;
 function change(i){bannerIndex=(i+3)%3;el.querySelector('.hero-track').style.transform='translate3d(-'+bannerIndex*100+'%,0,0)';el.querySelectorAll('.hero-dot').forEach((b,k)=>b.setAttribute('aria-current',k===bannerIndex?'true':'false'));}
 el.querySelectorAll('.hero-dot').forEach((b,k)=>b.addEventListener('click',()=>change(k)));
 el.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;pressed=true},{passive:true});
 el.addEventListener('touchend',e=>{if(!pressed)return;pressed=false;const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>25&&Math.abs(dx)>Math.abs(dy))change(bannerIndex+(dx<0?1:-1))},{passive:true});
 el.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;startX=e.clientX;startY=e.clientY;tracking=true;});
 el.addEventListener('pointerup',e=>{if(!tracking)return;tracking=false;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)>25&&Math.abs(dx)>Math.abs(dy))change(bannerIndex+(dx<0?1:-1));});
 el.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();change(bannerIndex+(e.key==='ArrowLeft'?-1:1));}});
 change(0);
}
function render(index){

 if(index===4){refreshAuth().then(()=>{if(current===4)showExtra('login');});showExtra('login');return;}
 app.innerHTML=wrap(pages[index]);
 app.querySelectorAll('.nv a').forEach((a,i)=>{a.href='#'+['inicio','cupones','qr','historial','mi-cuenta'][i];a.setAttribute('aria-current',i===index?'page':'false');});
 app.querySelector('.sc').scrollTop=0;
 if(index===0)setupHero();
 if(index===1)filterCoupons();
}

  if(key==='invite-share'){openShare();return;}
  if(key==='login'){showExtra('login');return;}

 const inp=document.getElementById('login-email'),msg=document.getElementById('login-error');
 if(!inp||!msg)return;
 if(!inp.validity.valid||!inp.value.trim()){msg.textContent='Introduce un correo electrónico válido.';inp.focus();return;}
 if(!authClient){msg.textContent='No se pudo conectar con el servicio de acceso. Inténtalo más tarde.';return;}
 const button=action;button.disabled=true;button.textContent='Enviando…';
 authEmail=inp.value.trim().toLowerCase();
 try{const {error}=await authClient.auth.signInWithOtp({email:authEmail,options:{shouldCreateUser:true}});if(error)throw error;showOtpForm(authEmail);}
 catch(error){msg.textContent=error.message||'No se pudo enviar el código.';}
 finally{button.disabled=false;button.textContent='Enviar código';}
 return;
}
if(key==='verify-login'){
 const token=document.getElementById('login-token')?.value.trim();
 const msg=document.getElementById('login-otp-status');
 if(!token||!/^[0-9]{6,8}$/.test(token)){if(msg)msg.textContent='Introduce el código recibido por correo.';return;}
 if(!authClient)return;
 action.disabled=true;
 try{const {data,error}=await authClient.auth.verifyOtp({email:authEmail,token,type:'email'});if(error)throw error;authUser=data.user||data.session?.user||null;showExtra('login');}
 catch(error){if(msg)msg.textContent=error.message||'Código inválido.';}
 finally{action.disabled=false;}
 return;
}
if(key==='logout'){if(authClient){await authClient.auth.signOut();authUser=null;}showExtra('login');return;}
  if(key==='coupon-info'){const item=cup[Number(action.dataset.index)];if(item)showExtra('coupon-info',item[0],Number(action.dataset.index));return;}
  if(key==='brand-coupons'){selected=action.dataset.brand;render(1);return;}
  if(key==='calc-charge'||key==='calc-fuel'){const keys=key==='calc-charge'?['kwh','rate']:['distance','consumption','fuelprice'];const n=keys.map(id=>Number(document.getElementById(id)?.value));const valid=keys.every(id=>document.getElementById(id)?.value!=='')&&n.every(v=>Number.isFinite(v)&&v>=0);const result=document.getElementById('calc-result');if(!valid){result.textContent='Introduce valores válidos en todos los campos.';return;}const total=key==='calc-charge'?n[0]*n[1]:(n[0]/100)*n[1]*n[2];result.textContent='Costo estimado: COP $'+Math.round(total).toLocaleString('es-CO');return;}
 }
 if(extra)return;
 if(current===0){
  const tile=e.target.closest('.tl>div');if(tile){const i=[...tile.parentElement.children].indexOf(tile);if(i===0)render(1);else showExtra(i===1?'charge':'auto');return;}

 }
 if(current===1){
