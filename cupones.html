<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#003f2e"><meta name="robots" content="noindex"><title>FuelGo México | Demostración interactiva</title><style>:root{color-scheme:light;--green:#064632;--dark:#003f2e;--gold:#ffdc65;--ink:#173c30;--muted:#60736a;--line:#dce8df;--bg:#f4f7f4;--radius:16px}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #bc8a1c;outline-offset:2px}button:disabled{opacity:.55;cursor:default}a{color:inherit}#app{width:100%;max-width:480px;margin:auto;height:100%;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}.top{background:var(--dark);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 11px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex:none}.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:21px;letter-spacing:-.5px}.brand img{width:35px;height:35px;object-fit:contain}.top button{border:0;color:#fff;background:#ffffff18;border-radius:12px;width:40px;height:40px;display:grid;place-items:center}.demo{font-size:10px;color:#fff4c3;border:1px solid #ffffff55;padding:4px 7px;border-radius:20px;white-space:nowrap}.screen{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:15px 15px 20px;scrollbar-width:none}.screen::-webkit-scrollbar,.rail::-webkit-scrollbar{display:none}.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:white;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom,0px));flex:none;gap:2px}.nav a{text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:51px;border-radius:12px;font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap}.nav a[aria-current=page]{background:#e5f2e9;color:var(--green);font-weight:800}.ico{width:22px;height:22px;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none;flex:none}h1,h2,h3,p{margin:0}h1{font-size:23px;letter-spacing:-.7px;line-height:1.2}h2{font-size:17px;letter-spacing:-.25px}h3{font-size:15px}p{font-size:13px;line-height:1.45;color:var(--muted)}.sub{margin-top:5px}.stack{display:grid;gap:12px}.section{display:flex;align-items:center;justify-content:space-between;margin-top:5px;gap:8px}.link{border:0;background:none;color:var(--green);font-weight:700;font-size:12px;padding:8px 0}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px}.primary,.secondary{min-height:43px;border:0;border-radius:11px;font-size:13px;font-weight:800;padding:10px 14px}.primary{background:var(--green);color:#fff}.secondary{background:#edf4ee;color:var(--green)}.gold{background:var(--gold);color:var(--dark)}.full{width:100%}.hero{background:linear-gradient(135deg,#003f2e,#09734c);color:white;padding:20px;border-radius:19px;min-height:164px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:12px}.hero:after{content:'%';position:absolute;right:12px;top:4px;font-size:110px;font-weight:900;color:#ffffff12;transform:rotate(-12deg);pointer-events:none}.hero strong{font-size:26px;line-height:1.12;max-width:230px;z-index:1}.hero p{color:#dbede4;z-index:1}.hero button{z-index:1}.hero small{font-size:11px;color:var(--gold);font-weight:700}.dots{display:flex;justify-content:center;gap:6px}.dots button{width:24px;height:6px;border:0;border-radius:5px;background:#d0ded4;padding:0}.dots button[aria-current=true]{background:var(--green)}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick button{background:white;border:1px solid var(--line);border-radius:14px;padding:12px 5px;display:grid;justify-items:center;gap:7px;font-size:11px;font-weight:700}.quick .ico{color:var(--green)}.rail{display:flex;gap:7px;overflow:auto;scrollbar-width:none;padding:2px 0}.chip{flex:none;white-space:nowrap;border:1px solid var(--line);border-radius:24px;background:white;font-size:12px;font-weight:650;padding:9px 12px}.chip[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}.logo{width:58px;height:48px;object-fit:contain;display:block}.logo-tile{flex:0 0 85px;display:grid;place-items:center;gap:5px;background:white;border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-size:10px;font-weight:700}.offer{display:grid;grid-template-columns:64px minmax(0,1fr);gap:9px 12px;align-items:center}.offer .amount{font-size:24px;font-weight:850;color:var(--green);letter-spacing:-.6px;line-height:1.1}.offer .actions{grid-column:1/-1;display:flex;gap:8px}.offer .actions>*{flex:1}.offer h3{margin-bottom:4px}.offer p{font-size:11px;margin-top:4px}.status{display:inline-block;border-radius:6px;background:#e6f2e8;color:#175d38;font-size:10px;font-weight:750;padding:4px 7px;white-space:nowrap}.status.used,.status.expired{background:#edf0ed;color:#657268}.status.claimed{background:#fff0c0;color:#745200}.empty{text-align:center;padding:26px 13px;display:grid;justify-items:center;gap:10px}.empty .ico{width:38px;height:38px;color:#77a18a}.summary{background:var(--dark);color:white;border-radius:18px;padding:19px;display:grid;gap:8px}.summary strong{font-size:31px;color:var(--gold)}.summary p{color:#d7e9dd}.row{display:flex;align-items:center;gap:10px}.row .grow{flex:1;min-width:0}.row h3{margin-bottom:3px}.row p{font-size:12px}.wallets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.wallets button{border:1px solid var(--line);background:white;border-radius:10px;min-width:0;height:56px;padding:5px}.wallets img{width:100%;height:100%;object-fit:contain}.menu-row{border:0;background:none;display:flex;align-items:center;width:100%;gap:12px;padding:13px 2px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;font-weight:650}.menu-row:last-child{border:0}.menu-row .ico:last-child{margin-left:auto;width:17px}.avatar{background:#e2f0e6;border-radius:50%;width:49px;height:49px;display:grid;place-items:center;color:var(--green)}.qr-panel{text-align:center;display:grid;gap:12px;justify-items:center}.qr-art{width:min(100%,220px);aspect-ratio:1;border:8px solid white;outline:1px solid var(--line);border-radius:12px;background:white;position:relative;overflow:hidden}.qr-art svg{width:100%;height:100%}.qr-art b{position:absolute;left:0;right:0;top:44%;background:#fff;color:#003f2e;font-size:12px;padding:6px;transform:rotate(-12deg);border-block:1px solid var(--green)}.notice{background:#fff6d9;border-radius:10px;padding:10px 12px;color:#725313;font-size:12px;line-height:1.45}.modal{position:absolute;inset:0;background:#092b20a8;display:flex;align-items:flex-end;z-index:20}.sheet{background:white;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-height:90%;overflow:auto;display:grid;gap:13px}.close{border:0;background:#eef2ee;border-radius:50%;width:35px;height:35px;display:grid;place-items:center}.toast{position:absolute;bottom:calc(83px + env(safe-area-inset-bottom,0px));left:14px;right:14px;background:#163c2e;color:white;padding:12px;border-radius:10px;text-align:center;font-size:13px;z-index:30}.field{display:grid;gap:6px;font-size:13px;font-weight:650}.field input{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}.check{display:flex;gap:8px;font-size:13px;align-items:center}.check input{accent-color:var(--green)}@media(min-width:481px){body{background:#e5ece7}#app{box-shadow:0 0 36px #173c3020}}@media(max-width:350px){.screen{padding:12px 10px}.offer{grid-template-columns:53px 1fr;gap:8px}.logo{width:49px}.nav a{font-size:9px}.brand{font-size:18px}.hero strong{font-size:23px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head><body><div id="app"></div><svg width="0" height="0" style="position:absolute"><defs>

<symbol id="i-x" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>

<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-8-5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 9c0 6-8 11-8 11z"/></symbol>

<script>
const app=document.getElementById('app');
const icons=n=>'<svg class="ico" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const tabs=['inicio','cupones','qr','historial','mi-cuenta'], labels=['Inicio','Cupones','QR','Historial','Mi cuenta'], tabIcons=['home','tkt','qr','clip','user'];
const brands={mobil:['Mobil','mobil.webp'],g500:['G500','g500.webp'],oxxogas:['OXXO GAS','oxxo-gas.webp'],shell:['Shell','shell-new.png'],repsol:['Repsol','repsol.webp']};
const wallets=[['BBVA','bbva'],['Banorte','banorte'],['Banamex','banamex'],['Santander','santander'],['Mercado Pago','mercado-pago'],['Spin by OXXO','spin'],['Banco Azteca','banco-azteca'],['Nu','nu']];
const offers=[{id:'M01',b:'mobil',amount:80,min:500},{id:'G02',b:'g500',amount:60,min:400},{id:'O03',b:'oxxogas',amount:100,min:600},{id:'S04',b:'shell',amount:50,min:350},{id:'R05',b:'repsol',amount:70,min:450},{id:'M06',b:'mobil',amount:40,min:300}];
const names={available:'Disponible',claimed:'Obtenido',used:'Utilizado',expired:'Vencido'};
const seed=()=>({states:{S04:'claimed',R05:'used',M06:'expired'},events:[{id:'R05',date:new Date().toISOString()}],active:'S04',notifications:true});
let data=seed();try{const saved=JSON.parse(localStorage.getItem('fuelgo-mx-demo-v2')||'null');if(saved&&saved.states&&Array.isArray(saved.events))data={...data,...saved};}catch(e){}
function save(){try{localStorage.setItem('fuelgo-mx-demo-v2',JSON.stringify(data));}catch(e){}}
const state=o=>data.states[o.id]||'available', money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(n)+' MXN';
const logo=b=>'<img class="logo" src="./'+brands[b][1]+'" alt="'+brands[b][0]+'">';
const btn=(label,action,id='',cls='primary')=>'<button type="button" class="'+cls+'" data-action="'+action+'" data-id="'+id+'">'+label+'</button>';
const status=o=>'<span class="status '+state(o)+'">'+names[state(o)]+'</span>';
const row=(ic,title,desc,action)=>'<button type="button" class="menu-row" data-action="'+action+'">'+icons(ic)+'<span class="grow">'+title+(desc?'<p>'+desc+'</p>':'')+'</span>'+icons('chev')+'</button>';
let current=0,brand='all',filter='all',slide=0,modal=null,timer;
function route(){let key=location.hash.slice(1)||location.pathname.split('/').pop().replace(/\.html$/,'');const i=tabs.indexOf(key);return i<0?0:i}
function go(i,write=true){if(i<0||i>4)return;current=i;modal=null;if(write&&location.hash!=='#'+tabs[i]){try{history.pushState(null,'','#'+tabs[i]);}catch(e){location.hash=tabs[i]}}render();}
const dateText=d=>new Intl.DateTimeFormat('es-MX',{day:'numeric',month:'short',year:'numeric'}).format(new Date(d));
const expiry=o=>{const d=new Date();d.setDate(d.getDate()+(state(o)==='expired'?-7:30));return dateText(d)};
function offerCard(o){const st=state(o);return '<article class="card offer">'+logo(o.b)+'<div><div class="row" style="justify-content:space-between;gap:4px"><h3>'+brands[o.b][0]+'</h3>'+status(o)+'</div><div class="amount">'+money(o.amount)+'</div><p>Compra desde '+money(o.min)+' · '+(st==='expired'?'Venció':'Válido hasta')+' '+expiry(o)+'</p></div><div class="actions">'+btn('Detalles','detail',o.id,'secondary')+(st==='available'?btn('Obtener cupón','claim',o.id):st==='claimed'?btn('Ver QR','show-qr',o.id):'<button class="secondary" disabled>'+names[st]+'</button>')+'</div></article>'}
function home(){const banners=[['Ahorra en combustible','Explora cupones de ejemplo.','Ver cupones','coupons'],['Comparte FuelGo','Invita a tus amigos a explorar la app.','Invitar amigos','invite'],['Tu ahorro en un lugar','Consulta tus movimientos de demostración.','Ver historial','history']];const b=banners[slide];return '<div class="stack"><div><h1>¡Hola, conductor!</h1><p class="sub">Tu próximo viaje empieza aquí.</p></div><div class="hero"><small>FUELGO MÉXICO · DEMO</small><strong>'+b[0]+'</strong><p>'+b[1]+'</p>'+btn(b[2],b[3],'','primary gold')+'</div><div class="dots">'+banners.map((_,i)=>'<button aria-label="Actividad '+(i+1)+'" aria-current="'+(i===slide)+'" data-action="slide" data-id="'+i+'"></button>').join('')+'</div><div class="quick">'+[['tkt','Cupones','coupons'],['pin','Estaciones','stations'],['car','Calculadora','calc']].map(x=>'<button data-action="'+x[2]+'">'+icons(x[0])+x[1]+'</button>').join('')+'</div><div class="section"><h2>Explora por marca</h2><button class="link" data-action="stations">Ver todas ›</button></div><div class="rail">'+Object.keys(brands).map(b=>'<button class="logo-tile" data-action="brand" data-id="'+b+'">'+logo(b)+brands[b][0]+'</button>').join('')+'</div><div class="section"><h2>Cupones recomendados</h2><button class="link" data-action="coupons">Ver todos ›</button></div>'+offers.filter(o=>state(o)==='available').slice(0,2).map(offerCard).join('')+'<p>Marcas y promociones ilustrativas, sin afiliación comercial implícita.</p></div>'}
function coupons(){const matches=offers.filter(o=>(brand==='all'||o.b===brand)&&(filter==='all'||state(o)===filter));return '<div class="stack"><div><h1>Cupones</h1><p class="sub">Explora y prueba los beneficios de ejemplo.</p></div><div class="rail" aria-label="Marcas">'+[['all','Todas'],...Object.entries(brands).map(([k,v])=>[k,v[0]])].map(([k,v])=>'<button class="chip" data-action="filter-brand" data-id="'+k+'" aria-pressed="'+(brand===k)+'">'+v+'</button>').join('')+'</div><div class="rail" aria-label="Estado">'+[['all','Todos'],['available','Disponibles'],['claimed','Obtenidos'],['used','Utilizados'],['expired','Vencidos']].map(([k,v])=>'<button class="chip" data-action="filter-status" data-id="'+k+'" aria-pressed="'+(filter===k)+'">'+v+'</button>').join('')+'</div><div class="section"><h2>Mis beneficios</h2><p>'+matches.length+' cupones</p></div>'+(matches.length?matches.map(offerCard).join(''):'<div class="card empty">'+icons('tkt')+'<h3>Sin cupones en esta lista</h3><p>Prueba otro filtro.</p>'+btn('Ver todos','coupons')+'</div>')+'<div class="notice">Promociones ficticias para demostrar la interfaz. No son canjeables.</div></div>'}
function qrArt(){let cells='';for(let y=0;y<21;y++)for(let x=0;x<21;x++){const corner=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);const xx=x%14,yy=y%14;const on=corner?(xx===0||xx===6||yy===0||yy===6||(xx>=2&&xx<=4&&yy>=2&&yy<=4)):((x*13+y*7+x*y)%11<5);if(on)cells+='<rect x="'+(x+2)+'" y="'+(y+2)+'" width="1" height="1"/>'}return '<div class="qr-art" role="img" aria-label="Patrón QR ilustrativo no válido"><svg viewBox="0 0 25 25" fill="#163a2d" aria-hidden="true">'+cells+'</svg><b>DEMO · NO VÁLIDO</b></div>'}
function qr(){const claimed=offers.filter(o=>state(o)==='claimed');const o=claimed.find(x=>x.id===data.active)||claimed[0];return '<div class="stack"><div><h1>Mi código QR</h1><p class="sub">Prueba cómo se mostraría tu cupón.</p></div>'+(o?'<div class="card qr-panel">'+logo(o.b)+'<h2>'+brands[o.b][0]+'</h2><div class="summary" style="width:100%;padding:12px"><span>Beneficio simulado</span><strong>'+money(o.amount)+'</strong></div>'+status(o)+qrArt()+'<p>Referencia de demostración: FG-DEMO-'+o.id+'</p><div class="notice">Este patrón no es un código válido y no permite canjes reales.</div>'+btn('Simular uso del cupón','use',o.id,'primary full')+'</div>'+ (claimed.length>1?'<h2>Otros cupones obtenidos</h2>'+claimed.filter(x=>x.id!==o.id).map(x=>btn(brands[x.b][0]+' · '+money(x.amount),'show-qr',x.id,'secondary full')).join(''):''):'<div class="card empty">'+icons('qr')+'<h3>Aún no tienes un cupón activo</h3><p>Obtén un cupón de ejemplo para ver su QR.</p>'+btn('Explorar cupones','coupons')+'</div>')+'</div>'}
function historyPage(){const ev=data.events.filter(e=>offers.some(o=>o.id===e.id));const total=ev.reduce((n,e)=>n+offers.find(o=>o.id===e.id).amount,0);return '<div class="stack"><h1>Historial</h1><div class="summary"><span>Ahorro simulado</span><strong>'+money(total)+'</strong><p>'+ev.length+' movimientos de demostración</p></div><h2>Actividad reciente</h2>'+(ev.length?ev.slice().reverse().map(e=>{const o=offers.find(x=>x.id===e.id);return '<div class="card row">'+logo(o.b)+'<div class="grow"><h3>'+brands[o.b][0]+'</h3><p>'+dateText(e.date)+' · Uso simulado</p>'+status(o)+'</div><strong>'+money(o.amount)+'</strong></div>'}).join(''):'<div class="card empty">'+icons('clip')+'<h3>Sin movimientos</h3><p>El uso simulado de tus cupones aparecerá aquí.</p>'+btn('Explorar cupones','coupons')+'</div>')+'</div>'}
function account(){return '<div class="stack"><h1>Mi cuenta</h1><div class="card row"><div class="avatar">'+icons('user')+'</div><div class="grow"><h2>Conductor FuelGo</h2><p>Perfil de demostración</p></div><span class="status">Demo</span></div><div class="card"><h2>Mi cartera</h2><p class="sub">Marcas de pago ilustrativas · sin conexión financiera.</p><div class="wallets">'+wallets.map(([n,p])=>'<button data-action="wallet" data-id="'+n+'" aria-label="'+n+'"><img src="./'+p+'.webp" alt="'+n+'"></button>').join('')+'</div></div><div class="card">'+row('tkt','Mis cupones','Consulta los obtenidos','my-coupons')+row('heart','Invitar amigos','','invite')+row('bell','Notificaciones',data.notifications?'Activadas (demo)':'Desactivadas (demo)','notifications')+row('shield','Privacidad y ajustes','','settings')+row('help','Ayuda y soporte','','help')+'</div></div>'}
function render(keep=false){const previous=app.querySelector('.screen');const pos=keep&&previous?previous.scrollTop:0;const views=[home,coupons,qr,historyPage,account];app.innerHTML='<header class="top"><div class="brand"><img src="./assets/fuelgo-borderless.svg" alt="">FuelGo <span style="font-size:13px;font-weight:600">México</span></div><span class="demo">DEMO</span><button aria-label="Mi cuenta" data-action="account">'+icons('user')+'</button></header><main class="screen" aria-label="'+labels[current]+'">'+views[current]()+'</main><nav class="nav" aria-label="Navegación principal">'+tabs.map((t,i)=>'<a href="#'+t+'" data-tab="'+i+'" aria-current="'+(i===current?'page':'false')+'">'+icons(tabIcons[i])+labels[i]+'</a>').join('')+'</nav>';app.querySelector('.screen').scrollTop=pos}
function sheet(title,body){closeSheet();modal=document.createElement('div');modal.className='modal';modal.innerHTML='<section class="sheet" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="row"><h2 class="grow">'+title+'</h2><button class="close" data-action="close" aria-label="Cerrar">'+icons('x')+'</button></div>'+body+'</section>';app.appendChild(modal);modal.querySelector('.close').focus()}
function closeSheet(){if(modal)modal.remove();modal=null}
function toast(t){app.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.role='status';el.textContent=t;app.appendChild(el);clearTimeout(timer);timer=setTimeout(()=>el.remove(),2200)}
function showDetail(o){sheet(brands[o.b][0],'<div class="row">'+logo(o.b)+'<div><h2>'+money(o.amount)+'</h2>'+status(o)+'</div></div><p>Compra mínima simulada: '+money(o.min)+'.</p><p>Vigencia de ejemplo: '+expiry(o)+'.</p><div class="notice">Beneficio ficticio, no disponible para compra o canje real.</div>'+(state(o)==='available'?btn('Obtener cupón de ejemplo','claim',o.id):state(o)==='claimed'?btn('Ver QR','show-qr',o.id):''))}
app.addEventListener('click',e=>{if(e.target===modal){closeSheet();return}const tab=e.target.closest('[data-tab]');if(tab){e.preventDefault();go(Number(tab.dataset.tab));return}const b=e.target.closest('[data-action]');if(!b)return;const k=b.dataset.action,id=b.dataset.id,o=offers.find(x=>x.id===id);
if(k==='close')closeSheet();else if(k==='slide'){slide=Number(id);render(true)}else if(k==='coupons'){brand=filter='all';go(1)}else if(k==='history')go(3);else if(k==='account')go(4);else if(k==='my-coupons'){brand='all';filter='claimed';go(1)}else if(k==='brand'){brand=id;filter='all';go(1)}else if(k==='filter-brand'||k==='filter-status'){if(k==='filter-brand')brand=id;else filter=id;const rails=[...app.querySelectorAll('.rail')].map(x=>x.scrollLeft);render(true);app.querySelectorAll('.rail').forEach((x,i)=>x.scrollLeft=rails[i]||0)}else if(k==='detail'&&o)showDetail(o);else if(k==='claim'&&o&&state(o)==='available'){data.states[id]='claimed';data.active=id;save();go(2);toast('Cupón de ejemplo obtenido')}else if(k==='show-qr'&&o&&state(o)==='claimed'){data.active=id;save();go(2)}else if(k==='use'&&o&&state(o)==='claimed'){sheet('Simular uso','<p>Este paso solo cambia el estado local del cupón. No realiza un canje.</p>'+btn('Confirmar simulación','confirm-use',id)+btn('Cancelar','close','','secondary'))}else if(k==='confirm-use'&&o&&state(o)==='claimed'){data.states[id]='used';data.events.push({id,date:new Date().toISOString()});data.active=null;save();go(3);toast('Uso simulado registrado')}else if(k==='stations'){sheet('Explora estaciones','<p>Directorio ilustrativo por marca. No usa tu ubicación.</p>'+Object.keys(brands).map(x=>'<div class="row">'+logo(x)+'<div class="grow"><h3>'+brands[x][0]+'</h3></div>'+btn('Cupones','brand',x,'secondary')+'</div>').join(''))}else if(k==='wallet'){sheet('Cartera de ejemplo','<p>'+id+'</p><div class="notice">No se vinculan cuentas ni se solicitan datos bancarios.</div>'+btn('Entendido','close'))}else if(k==='invite'){sheet('Invita a tus amigos','<p>Comparte únicamente esta vista de demostración.</p>'+btn('Copiar enlace de demo','copy')+btn('Cerrar','close','','secondary'))}else if(k==='copy'){const url=location.origin+'/cupones';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(url).then(()=>toast('Enlace copiado')).catch(()=>sheet('Enlace de demo','<input class="field" readonly value="'+url+'">'));else sheet('Enlace de demo','<input readonly value="'+url+'">')}else if(k==='notifications'){data.notifications=!data.notifications;save();render(true);toast('Preferencia local guardada')}else if(k==='settings'){sheet('Privacidad y ajustes','<p>La demo guarda únicamente estados ficticios en este navegador. No solicita datos personales ni se conecta a un servidor.</p>'+btn('Restablecer demostración','reset','','secondary'))}else if(k==='reset'){data=seed();save();brand=filter='all';go(0);toast('Demostración restablecida')}else if(k==='help'){sheet('Ayuda y soporte','<p>Explora cupones, obtén uno de ejemplo, muestra su QR ilustrativo y simula el uso para ver el historial.</p>'+btn('Entendido','close'))}else if(k==='calc'){sheet('Calculadora de combustible','<label class="field">Distancia (km)<input id="km" type="number" min="0" value="100"></label><label class="field">Consumo (L/100 km)<input id="liters" type="number" min="0" value="8"></label><label class="field">Precio de ejemplo (MXN/L)<input id="price" type="number" min="0" value="24"></label>'+btn('Calcular','calculate')+'<p id="result" role="status"></p>')}else if(k==='calculate'){const vals=['km','liters','price'].map(x=>document.getElementById(x).value);const nums=vals.map(Number);document.getElementById('result').textContent=vals.every(x=>x.trim()!=='')&&nums.every(x=>Number.isFinite(x)&&x>=0)?'Costo estimado: '+money(Math.round(nums[0]*nums[1]*nums[2]/100)):'Introduce valores válidos.'}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});window.addEventListener('popstate',()=>go(route(),false));window.addEventListener('hashchange',()=>{if(route()!==current)go(route(),false)});let touchX=0,touchY=0;app.addEventListener('touchstart',e=>{if(e.target.closest('.hero')){touchX=e.touches[0].clientX;touchY=e.touches[0].clientY}else touchX=NaN},{passive:true});app.addEventListener('touchend',e=>{if(current===0&&Number.isFinite(touchX)){const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)){slide=(slide+(dx<0?1:2))%3;render(true)}}touchX=NaN},{passive:true});go(route(),false);
</script></body></html>
