 el.addEventListener('touchend',e=>{if(!pressed)return;pressed=false;const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>25&&Math.abs(dx)>Math.abs(dy))change(bannerIndex+(dx<0?1:-1))},{passive:true});
 el.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;startX=e.clientX;startY=e.clientY;tracking=true;});
 el.addEventListener('pointerup',e=>{if(!tracking)return;tracking=false;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)>25&&Math.abs(dx)>Math.abs(dy))change(bannerIndex+(dx<0?1:-1));});
 el.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();change(bannerIndex+(e.key==='ArrowLeft'?-1:1));}});
 change(0);
}
function render(index){
 extra=null;current=index;
 if(index===2){showExtra('locked');return;}
 if(index===4){showExtra('login');return;}
 app.innerHTML=wrap(pages[index]);
 app.querySelectorAll('.nv a').forEach((a,i)=>{a.href='#'+['inicio','cupones','qr','historial','mi-cuenta'][i];a.setAttribute('aria-current',i===index?'page':'false');});
 app.querySelector('.sc').scrollTop=0;
 if(index===0)setupHero();
 if(index===1)filterCoupons();
}
function filterCoupons(){
 const chips=Array.from(app.querySelectorAll('.ch span'));
 chips.forEach((c,i)=>{const selectedChip=selected===['Todos','terpel','shell','primax','biomax','Más'][i];c.classList.toggle('on',selectedChip);c.classList.toggle('coupon-filter-active',selectedChip);});
 app.querySelectorAll('.cp').forEach((c,i)=>c.hidden=selected!=='Todos'&&selected!=='Más'&&cup[i][0]!==selected);
}
app.addEventListener('click',async e=>{
 const navLink=e.target.closest('.nv a');if(navLink){e.preventDefault();render([...navLink.parentElement.children].indexOf(navLink));return;}
 const hero=e.target.closest('[data-hero]');if(hero){if(hero.dataset.hero==='coupons')render(1);else openShare();return;}
 const action=e.target.closest('[data-action]');if(action){
  const key=action.dataset.action;
  if(key==='open-menu'){openMenu();return;}
  if(key==='back'){render(0);return;}
  if(key==='invite'){showExtra('invite');return;}
  if(key==='invite-share'){openShare();return;}
  if(key==='login'){showExtra('login');return;}
  if(key==='continue-login'){const inp=document.getElementById('login-email'),msg=document.getElementById('login-error');if(!inp||!msg)return;if(!inp.validity.valid||!inp.value.trim()){msg.textContent='Introduce un correo electrónico válido.';inp.focus();return;}msg.textContent='El inicio de sesión aún no está disponible. No se ha enviado ningún dato.';return;}
  if(key==='brand-coupons'){selected=action.dataset.brand;render(1);return;}
  if(key==='calc-charge'||key==='calc-fuel'){const keys=key==='calc-charge'?['kwh','rate']:['distance','consumption','fuelprice'];const n=keys.map(id=>Number(document.getElementById(id)?.value));const valid=keys.every(id=>document.getElementById(id)?.value!=='')&&n.every(v=>Number.isFinite(v)&&v>=0);const result=document.getElementById('calc-result');if(!valid){result.textContent='Introduce valores válidos en todos los campos.';return;}const total=key==='calc-charge'?n[0]*n[1]:(n[0]/100)*n[1]*n[2];result.textContent='Costo estimado: COP $'+Math.round(total).toLocaleString('es-CO');return;}
 }
 if(extra)return;
 if(current===0){
  const tile=e.target.closest('.tl>div');if(tile){const i=[...tile.parentElement.children].indexOf(tile);if(i===0)render(1);else showExtra(i===1?'charge':'auto');return;}
  const brandTile=e.target.closest('.br>div');if(brandTile){const i=[...brandTile.parentElement.children].indexOf(brandTile);showExtra('station',brands[i]);return;}
  const station=e.target.closest('.st');if(station){const i=[...station.parentElement.children].indexOf(station);showExtra('station',ord[i]);return;}
 }
 if(current===1){
  const chip=e.target.closest('.ch span');if(chip){const all=[...chip.parentElement.children];selected=['Todos','terpel','shell','primax','biomax','Más'][all.indexOf(chip)]||'Todos';filterCoupons();return;}
  if(e.target.closest('.cp .bt')){showExtra('login');return;}
 }
 if(e.target.closest('.hd .l'))render(0);
});
render(0);
</script></body></html>
